name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Build and validate package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          maintainer-atlas audit examples/healthy --format json --output release-evidence.json
          test -s release-evidence.json
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Maintainer Atlas $GITHUB_REF_NAME"
          fi
