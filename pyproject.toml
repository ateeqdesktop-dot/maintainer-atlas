[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-atlas"
version = "0.3.0"
description = "Evidence-backed release decision compiler with bounded reproducibility probes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]
license = "MIT"
authors = [{name = "ateeqdesktop-dot"}]
keywords = ["opensource", "maintainer", "repository-health", "ci", "sarif", "reproducibility", "evidence", "developer-experience"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
maintainer-atlas = "maintainer_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
