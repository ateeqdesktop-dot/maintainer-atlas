[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-atlas"
version = "0.1.0"
description = "Evidence-backed Open Source release-readiness auditor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ateeqdesktop-dot"}]
keywords = ["opensource", "maintainer", "repository-health", "ci", "sarif", "reproducibility"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.scripts]
maintainer-atlas = "maintainer_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
