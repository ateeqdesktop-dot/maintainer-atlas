name: Maintainer Atlas
description: Evidence-backed Open Source release-readiness audit
inputs:
  policy:
    description: Optional path to a JSON policy file
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install .
    - shell: bash
      run: |
        if [[ -n "${{ inputs.policy }}" ]]; then
          maintainer-atlas audit . --policy "${{ inputs.policy }}" --format sarif --output maintainer-atlas.sarif
        else
          maintainer-atlas audit . --format sarif --output maintainer-atlas.sarif
        fi
