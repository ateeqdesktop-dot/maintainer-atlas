name: Maintainer Atlas
description: Evidence-backed Open Source readiness audit with optional bounded probes
inputs:
  policy:
    description: Optional path to a JSON policy file
    required: false
    default: ""
  probe-config:
    description: Optional path to a reviewed .atlas-probe.toml plan; empty means passive audit only
    required: false
    default: ""
  baseline:
    description: Optional path to a prior JSON evidence bundle for regression-aware status
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install '.[dev]'
    - shell: bash
      run: |
        set -euo pipefail
        audit_args=(audit . --format sarif --output maintainer-atlas.sarif)
        if [[ -n "${{ inputs.policy }}" ]]; then audit_args+=(--policy "${{ inputs.policy }}"); fi
        if [[ -n "${{ inputs.baseline }}" ]]; then audit_args+=(--baseline "${{ inputs.baseline }}"); fi
        maintainer-atlas "${audit_args[@]}"
        json_args=(audit . --format json --output maintainer-atlas.json)
        if [[ -n "${{ inputs.policy }}" ]]; then json_args+=(--policy "${{ inputs.policy }}"); fi
        if [[ -n "${{ inputs.baseline }}" ]]; then json_args+=(--baseline "${{ inputs.baseline }}"); fi
        maintainer-atlas "${json_args[@]}" || test $? -le 2
        if [[ -n "${{ inputs.probe-config }}" ]]; then
          maintainer-atlas probe . --config "${{ inputs.probe-config }}" --format json --output atlas-probe.json
        fi
